<!doctype html>

<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>rpgdle</title>
        <script src="https://cdn.jsdelivr.net/npm/@msgpack/msgpack@3.1.3/dist.umd/msgpack.min.js"></script>
        <link rel="stylesheet" href="styles.css">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Cinzel:wght@700&family=Uncial+Antiqua&family=IM+Fell+English+SC&family=Cormorant+Garamond:wght@700&display=swap">
        <link rel="icon" href="/assets/favicon.ico" type="image/x-icon">
    </head>
    <body>
        <div id="container">
            <div id="canvas-container">
                <canvas id="game"></canvas>
            </div>
            <div id="chat-container">
                <div id="chat-log" role="log" aria-live="polite" aria-label="Chat"></div>
                <input type="text" id="chatbox" name="chatbox" placeholder="Press / or Enter to chat" maxlength="200" autocomplete="off" spellcheck="false" aria-label="Chat message">
            </div>
            <div id="hud" hidden>
                <button type="button" id="hudLeaderboard" class="hud-btn" title="Leaderboard" aria-label="Leaderboard">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4zM7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3"/></svg>
                    <span class="hud-label">Leaderboard</span>
                </button>
                <button type="button" id="hudLogout" class="hud-btn" title="Log out" aria-label="Log out">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
                    <span class="hud-label">Log out</span>
                </button>
            </div>
            <div id="player-card" class="player-card" hidden>
                <div class="pc-who">
                    <span class="pc-char"></span>
                    <span class="pc-class"></span>
                </div>
                <div class="pc-user"></div>
                <button type="button" id="pcDuel" class="btn btn-primary pc-duel">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 17.5 3 6V3h3l11.5 11.5M13 19l6-6M16 16l4 4M19 21l2-2M9.5 17.5 21 6V3h-3L6.5 14.5M11 19l-6-6M8 16l-4 4M5 21l-2-2"/></svg>
                    Duel
                </button>
            </div>
            <div id="notifications" aria-live="polite"></div>
            <div id="reconnecting">Connection lost, reconnecting&hellip;</div>
            <div id="toast"></div>
        </div>

        <template id="tpl-login">
            <div id="loginPopup" class="overlay overlay-solid">
                <div class="panel auth-panel loginContainer" id="loginContainer">
                    <h1 class="auth-title">rpgdle</h1>
                    <p id="errorText"></p>
                    <label for="uname">Username</label>
                    <input type="text" id="uname" placeholder="Enter username" name="uname" autocomplete="username" required>
                    <label for="psw">Password</label>
                    <input type="password" id="psw" placeholder="Enter password" name="psw" autocomplete="current-password" required>
                    <button id="submitLogin" class="btn btn-primary" type="submit">Log in</button>
                    <button id="openSignup" class="btn btn-ghost">Create account</button>
                </div>
            </div>
        </template>

        <template id="tpl-signup">
            <div id="signupPopup" class="overlay overlay-solid">
                <div class="panel auth-panel signupContainer" id="signupContainer">
                    <h1 class="auth-title">rpgdle</h1>
                    <p class="auth-sub">Create an account</p>
                    <div id="error"></div>
                    <label for="signupuname">Username</label>
                    <input type="text" id="signupuname" placeholder="Choose a username" name="signupuname" autocomplete="username" required>
                    <label for="signuppsw">Password</label>
                    <input type="password" id="signuppsw" placeholder="Choose a password" name="signuppsw" autocomplete="new-password" required>
                    <button id="submitSignup" class="btn btn-primary" type="submit">Sign up</button>
                    <button id="deleteSignup" class="btn btn-ghost">Back to login</button>
                </div>
            </div>
        </template>

        <template id="tpl-characters">
            <div id="charactersPopup" class="overlay overlay-solid">
                <div class="panel chars-panel">
                    <header class="panel-head">
                        <h1 class="panel-title">Choose a character</h1>
                        <span id="charsUser" class="chars-user"></span>
                    </header>
                    <p id="charsError" class="form-error"></p>
                    <div id="charSlots" class="char-slots"></div>
                    <button id="charsLogout" class="btn btn-ghost btn-wide">Log out</button>
                </div>
            </div>
        </template>

        <template id="tpl-char-create">
            <div id="charCreatePopup" class="overlay overlay-top">
                <div class="panel char-create-panel">
                    <header class="panel-head">
                        <h1 class="panel-title">New character</h1>
                    </header>
                    <p id="charError" class="form-error"></p>
                    <label for="charName" class="field-label">Name</label>
                    <input type="text" id="charName" class="field-input" maxlength="20" autocomplete="off" spellcheck="false" placeholder="Name your character">
                    <p class="field-label">Class</p>
                    <div id="classChoices" class="class-choices"></div>
                    <div class="btn-row">
                        <button id="cancelCreate" class="btn btn-ghost">Cancel</button>
                        <button id="submitCreate" class="btn btn-primary">Create</button>
                    </div>
                </div>
            </div>
        </template>

        <template id="tpl-char-delete">
            <div id="charDeletePopup" class="overlay overlay-top">
                <div class="panel result-panel">
                    <header class="panel-head">
                        <h1 class="panel-title">Delete character</h1>
                    </header>
                    <p class="result-text">Delete <strong id="deleteName"></strong>? This can't be undone.</p>
                    <div class="btn-row">
                        <button id="cancelDelete" class="btn btn-ghost">Cancel</button>
                        <button id="confirmDelete" class="btn btn-danger">Delete</button>
                    </div>
                </div>
            </div>
        </template>

        <template id="tpl-wordle-game">
            <div id="wordlePopup" class="overlay">
                <div class="panel wordle-panel">
                    <header class="panel-head">
                        <h1 class="panel-title">Wordle</h1>
                        <div id="timer" class="timer">0:00</div>
                        <button class="exit icon-btn" aria-label="Close">&times;</button>
                    </header>
                    <div class="gameContainer" id="gameContainer">
                        <div class="wordContainer" id="wordContainer0">
                            <input type="text" class="letter" id="letter-0-0" maxlength="1" autocomplete="off" spellcheck="false" placeholder=" ">
                        </div>
                    </div>
                    <p class="hint">Enter submits &middot; Backspace clears the row</p>
                    <button id="submit" class="btn btn-primary btn-wide">Submit</button>
                    <p class="section-label ability-label">Abilities</p>
                    <div class="ability-bar" id="abilityBar"></div>
                </div>
            </div>
        </template>

        <template id="tpl-wordle-played">
            <div id="resultPopup" class="overlay overlay-top">
                <div class="panel result-panel resultContainer" id="resultContainer">
                    <header class="panel-head">
                        <h1 class="panel-title">Already played</h1>
                        <button class="exit icon-btn" aria-label="Close">&times;</button>
                    </header>
                    <p class="result-text">You've finished today's Wordle. Come back tomorrow for a new word.</p>
                    <button class="exit btn btn-ghost btn-wide">Close</button>
                </div>
            </div>
        </template>

        <template id="tpl-wordle-result">
            <div id="resultPopup" class="overlay overlay-top">
                <div class="panel result-panel resultContainer" id="resultContainer">
                    <header class="panel-head">
                        <h1 class="panel-title" id="resultTitle"></h1>
                        <button class="exit icon-btn" aria-label="Close">&times;</button>
                    </header>
                    <p id="resultText" class="result-text"></p>
                    <div class="stats">
                        <div class="stat">
                            <span class="stat-value" id="resultGuesses"></span>
                            <span class="stat-label">Guesses</span>
                        </div>
                        <div class="stat">
                            <span class="stat-value" id="resultTime"></span>
                            <span class="stat-label">Time</span>
                        </div>
                    </div>
                    <p class="section-label">The word was</p>
                    <div id="solutionText" class="solution"></div>
                    <button class="exit btn btn-ghost btn-wide">Close</button>
                </div>
            </div>
        </template>

        <template id="tpl-duel">
            <div id="duelPopup" class="overlay">
                <div class="panel duel-panel">
                    <header class="panel-head">
                        <h1 class="panel-title">Duel <span class="duel-vs">vs</span> <span id="duelVsName" class="duel-vs-name"></span> <span id="duelVsClass" class="duel-vs-class"></span></h1>
                        <div id="duelTimer" class="timer">0:00</div>
                        <button id="duelForfeit" class="icon-btn" aria-label="Forfeit" title="Forfeit">&times;</button>
                    </header>
                    <div class="duel-boards">
                        <section class="duel-side duel-you">
                            <p class="section-label">You</p>
                            <div id="duelBoard" class="board"></div>
                            <p id="duelYouStatus" class="hint">Enter submits &middot; Backspace clears the row</p>
                            <button id="duelSubmit" class="btn btn-primary btn-wide">Submit</button>
                        </section>
                        <section class="duel-side duel-them">
                            <p class="section-label"><span id="duelOppLabel"></span></p>
                            <div id="duelOpponent" class="board opp-board" aria-label="Opponent's guesses, colors only"></div>
                            <p id="duelOppStatus" class="duel-opp-status"></p>
                        </section>
                    </div>
                </div>
            </div>
        </template>

        <template id="tpl-duel-forfeit">
            <div id="duelForfeitPopup" class="overlay overlay-top">
                <div class="panel result-panel">
                    <header class="panel-head">
                        <h1 class="panel-title">Forfeit the duel?</h1>
                    </header>
                    <p class="result-text"><strong id="forfeitName"></strong> wins if you give up now.</p>
                    <div class="btn-row">
                        <button id="cancelForfeit" class="btn btn-ghost">Keep playing</button>
                        <button id="confirmForfeit" class="btn btn-danger">Forfeit</button>
                    </div>
                </div>
            </div>
        </template>

        <template id="tpl-duel-result">
            <div id="duelResultPopup" class="overlay overlay-top">
                <div class="panel result-panel duel-result">
                    <header class="panel-head">
                        <h1 class="panel-title" id="duelResultTitle"></h1>
                        <button class="exit icon-btn" aria-label="Close">&times;</button>
                    </header>
                    <p id="duelResultText" class="result-text"></p>
                    <p class="section-label">The word was</p>
                    <div id="duelSolution" class="solution"></div>
                    <button class="exit btn btn-ghost btn-wide">Close</button>
                </div>
            </div>
        </template>

        <template id="tpl-leaderboard">
            <div id="leaderboardPopup" class="overlay">
                <div class="panel lb-panel leaderboardContainer" id="leaderboardContainer">
                    <header class="panel-head">
                        <h1 class="panel-title">Wordle Rankings</h1>
                        <button class="exit icon-btn" aria-label="Close">&times;</button>
                    </header>
                    <nav class="day-nav" id="days">
                        <button id="prevDay" class="icon-btn" aria-label="Previous day" title="Previous day">&lsaquo;</button>
                        <div class="day-label">
                            <h2 id="date"></h2>
                            <span id="dateTag" class="tag"></span>
                        </div>
                        <button id="nextDay" class="icon-btn" aria-label="Next day" title="Next day">&rsaquo;</button>
                    </nav>
                    <div class="table-wrap" id="lbWrap">
                        <table id="lb">
                            <thead>
                                <tr id="h">
                                    <th class="col-place">#</th>
                                    <th class="col-name">Player</th>
                                    <th class="col-num">Guesses</th>
                                    <th class="col-num">Time</th>
                                </tr>
                            </thead>
                            <tbody id="lbBody"></tbody>
                        </table>
                    </div>
                    <footer class="pager" id="pager">
                        <button id="pageUp" class="btn btn-ghost">&lsaquo; Prev</button>
                        <span id="pageInfo" class="page-info"></span>
                        <button id="pageDown" class="btn btn-ghost">Next &rsaquo;</button>
                    </footer>
                </div>
            </div>
        </template>

        <script src="./app.js" type="module"></script>
    </body>
</html>
