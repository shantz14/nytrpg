# Production. Settings come from .env next to this file (see .env.example).
#   docker compose up -d
# The app listens on 127.0.0.1:8080 for a Cloudflare Tunnel (or any proxy on
# the host). To have Caddy serve HTTPS itself instead, set
# COMPOSE_PROFILES=caddy and SITE_ADDRESS=<your domain> in .env.
services:
  app:
    image: nytrpg:latest
    build: .
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - ./db:/nytrpg/db
    ports:
      - "127.0.0.1:8080:8080"

  caddy:
    image: caddy:2
    profiles: [caddy]
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
